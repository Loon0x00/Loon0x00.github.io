<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Loon4Mac Gateway Topology</title>
  <desc id="desc">LAN devices connect over Ethernet to a Mac running Loon, then access the internet through Loon rules and proxies.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="loon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5596ff"/>
      <stop offset="1" stop-color="#2d6de8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#17366c" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b86ed"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: #17243b; }
      .label { font-size: 22px; font-weight: 650; fill: #20304c; }
      .sub { font-size: 18px; fill: #687995; }
      .white { fill: #fff; }
    </style>
  </defs>
  <rect width="1200" height="620" rx="32" fill="url(#bg)"/>
  <text x="600" y="62" text-anchor="middle" class="title">LAN Devices Access the Network through Loon4Mac</text>

  <path d="M 337 310 H 478" fill="none" stroke="#4b86ed" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M 722 310 H 863" fill="none" stroke="#4b86ed" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="408" y="285" text-anchor="middle" class="sub">IPv4 / IPv6</text>
  <text x="792" y="285" text-anchor="middle" class="sub">Rules and Proxies</text>

  <g filter="url(#shadow)">
    <rect x="72" y="151" width="265" height="318" rx="28" fill="#fff"/>
  </g>
  <rect x="108" y="194" width="86" height="138" rx="17" fill="#dbe7fb" stroke="#8ca9d6" stroke-width="4"/>
  <rect x="124" y="210" width="54" height="91" rx="8" fill="#fff"/>
  <circle cx="151" cy="315" r="6" fill="#8ca9d6"/>
  <rect x="211" y="215" width="89" height="66" rx="10" fill="#dbe7fb" stroke="#8ca9d6" stroke-width="4"/>
  <path d="M 197 300 H 314 L 296 326 H 215 Z" fill="#b8cbea"/>
  <text x="204" y="380" text-anchor="middle" class="label">Client Devices</text>
  <text x="204" y="416" text-anchor="middle" class="sub">Phone · Computer · TV</text>

  <g filter="url(#shadow)">
    <rect x="478" y="133" width="244" height="354" rx="32" fill="url(#loon)"/>
  </g>
  <rect x="525" y="187" width="150" height="101" rx="14" fill="#dce9ff"/>
  <rect x="543" y="205" width="114" height="65" rx="6" fill="#fff"/>
  <path d="M 506 309 H 694 L 670 333 H 530 Z" fill="#c6d9fb"/>
  <circle cx="600" cy="374" r="27" fill="#fff" fill-opacity=".18"/>
  <path d="M 588 374 H 612 M 600 362 V 386" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <text x="600" y="431" text-anchor="middle" class="label white">Loon4Mac Gateway</text>
  <text x="600" y="461" text-anchor="middle" class="sub white" opacity=".86">VPN Network Extension</text>

  <g filter="url(#shadow)">
    <rect x="863" y="151" width="265" height="318" rx="28" fill="#fff"/>
  </g>
  <path d="M 931 282 C 915 237 954 199 997 219 C 1021 180 1082 198 1080 244 C 1121 253 1123 316 1079 325 H 947 C 904 324 898 294 931 282 Z" fill="#dbe7fb" stroke="#8ca9d6" stroke-width="4"/>
  <path d="M 979 274 H 1051 M 1015 238 V 310" stroke="#5d86c7" stroke-width="7" stroke-linecap="round"/>
  <text x="995" y="380" text-anchor="middle" class="label">Internet</text>
  <text x="995" y="416" text-anchor="middle" class="sub">Direct or Proxy Node</text>

  <rect x="270" y="526" width="660" height="54" rx="27" fill="#e0ebff"/>
  <text x="600" y="561" text-anchor="middle" class="sub">Only devices using Loon as their default gateway follow this path</text>
</svg>

