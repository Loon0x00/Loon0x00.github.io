<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Loon4Mac DHCP 配置流程</title>
  <desc id="desc">设备向 Loon DHCP 请求网络配置，Loon 返回 IP、子网、网关和 DNS，设备随后连接局域网或使用 Loon 网关。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#edf4ff"/>
    </linearGradient>
    <linearGradient id="server" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5c9bff"/>
      <stop offset="1" stop-color="#316fe8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="14" flood-color="#183a72" flood-opacity=".12"/>
    </filter>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4d87ee"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34a876"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: #17243b; }
      .label { font-size: 22px; font-weight: 650; fill: #20304c; }
      .sub { font-size: 18px; fill: #687995; }
      .item { font-size: 17px; font-weight: 600; fill: #315078; }
    </style>
  </defs>
  <rect width="1200" height="620" rx="32" fill="url(#bg)"/>
  <text x="600" y="62" text-anchor="middle" class="title">设备接入时，Loon 自动下发网络配置</text>

  <g filter="url(#shadow)">
    <rect x="74" y="170" width="245" height="285" rx="28" fill="#fff"/>
  </g>
  <rect x="145" y="211" width="103" height="166" rx="21" fill="#dce8fb" stroke="#89a7d5" stroke-width="4"/>
  <rect x="163" y="230" width="67" height="111" rx="9" fill="#fff"/>
  <circle cx="196" cy="357" r="7" fill="#89a7d5"/>
  <text x="196" y="414" text-anchor="middle" class="label">接入设备</text>

  <path d="M 319 244 H 474" fill="none" stroke="#4d87ee" stroke-width="6" stroke-linecap="round" marker-end="url(#blueArrow)"/>
  <text x="396" y="219" text-anchor="middle" class="sub">请求网络配置</text>
  <path d="M 474 359 H 319" fill="none" stroke="#34a876" stroke-width="6" stroke-linecap="round" marker-end="url(#greenArrow)"/>
  <text x="396" y="397" text-anchor="middle" class="sub">返回租约</text>

  <g filter="url(#shadow)">
    <rect x="474" y="134" width="294" height="357" rx="32" fill="url(#server)"/>
  </g>
  <rect x="527" y="184" width="188" height="52" rx="12" fill="#fff" fill-opacity=".95"/>
  <circle cx="555" cy="210" r="8" fill="#4e8df5"/>
  <rect x="579" y="201" width="106" height="18" rx="9" fill="#c8daf8"/>
  <rect x="527" y="251" width="188" height="52" rx="12" fill="#fff" fill-opacity=".95"/>
  <circle cx="555" cy="277" r="8" fill="#4e8df5"/>
  <rect x="579" y="268" width="106" height="18" rx="9" fill="#c8daf8"/>
  <rect x="527" y="318" width="188" height="52" rx="12" fill="#fff" fill-opacity=".95"/>
  <circle cx="555" cy="344" r="8" fill="#4e8df5"/>
  <rect x="579" y="335" width="106" height="18" rx="9" fill="#c8daf8"/>
  <text x="621" y="418" text-anchor="middle" class="label" fill="#fff">Loon DHCP</text>
  <text x="621" y="450" text-anchor="middle" class="sub" fill="#fff" opacity=".86">有线以太网</text>

  <path d="M 768 312 H 888" fill="none" stroke="#4d87ee" stroke-width="6" stroke-linecap="round" marker-end="url(#blueArrow)"/>

  <g filter="url(#shadow)">
    <rect x="888" y="155" width="238" height="315" rx="28" fill="#fff"/>
  </g>
  <text x="1007" y="205" text-anchor="middle" class="label">下发内容</text>
  <g>
    <rect x="929" y="236" width="156" height="42" rx="21" fill="#e6efff"/>
    <text x="1007" y="263" text-anchor="middle" class="item">IP 地址</text>
    <rect x="929" y="292" width="156" height="42" rx="21" fill="#e6efff"/>
    <text x="1007" y="319" text-anchor="middle" class="item">子网掩码</text>
    <rect x="929" y="348" width="156" height="42" rx="21" fill="#e6efff"/>
    <text x="1007" y="375" text-anchor="middle" class="item">默认网关</text>
    <rect x="929" y="404" width="156" height="42" rx="21" fill="#e6efff"/>
    <text x="1007" y="431" text-anchor="middle" class="item">DNS</text>
  </g>

  <rect x="240" y="531" width="720" height="54" rx="27" fill="#e0ebff"/>
  <text x="600" y="566" text-anchor="middle" class="sub">DHCP 下发 IPv4；IPv6 地址、路由和 DNS 通过路由通告提供</text>
</svg>
